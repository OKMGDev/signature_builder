name: Sync Signature Assets to S3

on:
  push:
    branches:
      - main
    paths:
      - 'assets/signatures/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync assets to S3
        run: |
          # Never use --delete: pasted email signatures depend on stable versioned URLs.
          # Add new logos under v2/ instead of overwriting v1/ files.
          aws s3 sync assets/signatures/ s3://${{ secrets.AWS_S3_BUCKET }}/signatures/ \
            --cache-control "public, max-age=31536000"
